name: Build and run tests (github)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  schedule:
    - cron: '0 1 * * *'

  # allow manual run
  workflow_dispatch: {}

# allow fast cancel on new commit to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build and test
      run: mvn test -B -Dxmage.dataCollectors.printGameLogs=false -Dlog4j.configuration=file:${GITHUB_WORKSPACE}/.travis/log4j.properties
    - name: Check cards changes
      uses: actions/github-script@v7
      with:
        script: |
          const summary = "### Card Tests\n\n- changes: 12\n- correct: 10 out of 12 (83%)\n\n| Card | Result |\n|---|---|\n| ... | ✅ |";
          await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: 'Card Tests',
            head_sha: context.sha,
            status: 'completed',
            conclusion: 'success',
            output: { title: '10/12 cards correct', summary }
          });
